name: Publish 8bars
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify composition rules
        run: |
          npm test
          node --check app.js
          node --check humanradio.js
          node --check radio-planner.js
          node --check radio-channels.js
          node --check radio-names.js
          node --check electronic-bass.js
          node --check genre-arrangement.js
          node --check radio-form.js
          node --check sounds.js
          node --check pitched-vocals.js
          node --check extra-samples.js
          node --check sample-levels.js
          node --check instrument-maps.js
          node --check vcsl-samples.js
          node --check settings.js
          node --check transport.js
          node --check audio-files.js
          node --check composer.js
          node --check music-engines.js
          node --check music-ecology.js
          node --check harmony.js
          node --check theory.js
          node --check commons-audio.js
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html humanradio.html humanradio.js radio-planner.js radio-channels.js radio-names.js radio-words.txt genre-arrangement.js electronic-bass.js ELECTRONIC-BASS-LICENSE.txt radio-form.js favicon.svg style.css app.js composer.js music-engines.js music-ecology.js harmony.js theory.js sounds.js instrument-maps.js vcsl-samples.js extra-samples.js pitched-vocals.js sample-levels.js settings.js transport.js audio-files.js commons-audio.js .nojekyll dist/
          python3 -m pip install --break-system-packages --quiet pillow cairosvg
          python3 scripts/build-favicons.py dist
          test -s dist/favicon.ico
          test -s dist/apple-touch-icon.png
          test -s dist/index.html
          test -s dist/humanradio.html
          test -s dist/humanradio.js
          test -s dist/radio-planner.js
          test -s dist/radio-channels.js
          test -s dist/radio-names.js
          test -s dist/radio-words.txt
          test -s dist/electronic-bass.js
          test -s dist/ELECTRONIC-BASS-LICENSE.txt
          test -s dist/genre-arrangement.js
          test -s dist/radio-form.js
          if curl --fail --location --silent --show-error --retry 2 --max-time 40 "https://i.kym-cdn.com/photos/images/newsfeed/001/225/551/385.gif" -o dist/humanradio.gif && head -c 3 dist/humanradio.gif | grep -q GIF; then
            echo "Human Radio animation cached"
          else
            rm -f dist/humanradio.gif
            echo "::warning::Animation not cached; page will use source fallback"
          fi
          test -s dist/composer.js
          test -s dist/music-engines.js
          test -s dist/music-ecology.js
          test -s dist/harmony.js
          test -s dist/theory.js
          test -s dist/sounds.js
          test -s dist/instrument-maps.js
          test -s dist/vcsl-samples.js
          test -s dist/extra-samples.js
          test -s dist/pitched-vocals.js
          test -s dist/sample-levels.js
          test -s dist/settings.js
          test -s dist/transport.js
          test -s dist/audio-files.js
          test -s dist/commons-audio.js
      - name: Restore cached sample recordings
        uses: actions/cache@v4
        with:
          path: .sample-cache
          key: 8bars-mp3-v2-${{ hashFiles('sounds.js', 'electronic-bass.js', 'instrument-maps.js', 'vcsl-samples.js', 'extra-samples.js', 'pitched-vocals.js') }}
          restore-keys: |
            8bars-mp3-v2-
      - name: Copy recorded samples into site artifact
        env:
          SAMPLE_MIRROR_BUDGET_MB: 400
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          node --check scripts/mirror-samples.mjs
          node scripts/mirror-samples.mjs dist
          test -s dist/sample-map.js
          test -s dist/sample-mirror-report.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
