name: Publish 8bars
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify composition rules
        run: |
          npm test
          node --check app.js
          node --check sounds.js
          node --check vocal-samples.js
          node --check pitched-vocals.js
          node --check extra-samples.js
          node --check sample-levels.js
          node --check instrument-maps.js
          node --check vcsl-samples.js
          node --check settings.js
          node --check transport.js
          node --check audio-files.js
          node --check composer.js
          node --check theory.js
          node --check commons-audio.js
      - name: Prepare static site
        run: |
          mkdir -p dist
          cp index.html style.css app.js composer.js theory.js sounds.js instrument-maps.js vcsl-samples.js extra-samples.js vocal-samples.js pitched-vocals.js sample-levels.js settings.js transport.js audio-files.js commons-audio.js .nojekyll dist/
          test -s dist/index.html
          test -s dist/composer.js
          test -s dist/theory.js
          test -s dist/sounds.js
          test -s dist/instrument-maps.js
          test -s dist/vcsl-samples.js
          test -s dist/extra-samples.js
          test -s dist/vocal-samples.js
          test -s dist/pitched-vocals.js
          test -s dist/sample-levels.js
          test -s dist/settings.js
          test -s dist/transport.js
          test -s dist/audio-files.js
          test -s dist/commons-audio.js
      - name: Restore cached sample recordings
        uses: actions/cache@v4
        with:
          path: .sample-cache
          key: 8bars-mp3-v2-${{ hashFiles('sounds.js', 'instrument-maps.js', 'vcsl-samples.js', 'extra-samples.js', 'vocal-samples.js', 'pitched-vocals.js') }}
          restore-keys: |
            8bars-mp3-v2-
      - name: Copy recorded samples into site artifact
        env:
          SAMPLE_MIRROR_BUDGET_MB: 400
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          node --check scripts/mirror-samples.mjs
          node scripts/mirror-samples.mjs dist
          test -s dist/sample-map.js
          test -s dist/sample-mirror-report.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
